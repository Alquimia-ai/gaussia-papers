# Strategies de EVASIÓN (inspiradas en promptfoo): cómo se disfraza/entrega una
# query ya generada, para intentar esquivar las defensas del asistente. Distinto
# de config/strategies.yaml (que define cómo se CONSTRUYE una query desde la KB) —
# esto opera después, sobre el texto ya armado, sin importar qué motor lo generó.
#
# kind: static     -> transformación determinística, sin LLM atacante.
# kind: dynamic    -> usa un LLM atacante para refinar/iterar la query.
# kind: multiturn  -> requiere sesión de conversación con estado (ver
#                     target_client.ConversationSession).
# implemented: si es false, el id está documentado pero src/evasion.py todavía no
# tiene una función registrada para él (falla fuerte si se intenta usar).
evasion_strategies:
  - id: base64
    name: Codificación Base64
    kind: static
    implemented: true
    description: >
      Codifica la query en Base64 con una instrucción de decodificarla antes de
      responder.

  - id: rot13
    name: Codificación ROT13
    kind: static
    implemented: true
    description: >
      Codifica la query con ROT13 con una instrucción de decodificarla antes de
      responder.

  - id: jailbreak_simple
    name: Jailbreak iterativo simple
    kind: dynamic
    implemented: false
    description: >
      Refina la query con un LLM atacante liviano hasta que logre evadir las
      defensas del target. Pendiente: requiere un loop de generación/evaluación
      contra el target antes de congelar la query final.

  - id: composite_jailbreak
    name: Jailbreak compuesto
    kind: dynamic
    implemented: false
    description: >
      Encadena varias técnicas conocidas (DAN, Skeleton Key, etc.). Pendiente:
      requiere una librería de plantillas de jailbreak conocidas.

  - id: crescendo
    name: Escalada gradual (Crescendo)
    kind: multiturn
    implemented: false
    description: >
      Escala gradualmente el pedido a lo largo de varios turnos de conversación,
      retrocediendo si el asistente resiste. Pendiente: el scaffold de
      ConversationSession (target_client.py) prueba que la sesión persiste
      turno a turno, pero todavía no implementa la lógica de escalada/backtrack.
